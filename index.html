.pf-wealth{left:22%;top:22%;width:56%;height:56%;background:conic-gradient(transparent,var(--rc),transparent 40%,var(--rc),transparent 80%);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%,#000 68%,transparent 70%);mask:radial-gradient(circle,transparent 60%,#000 62%,#000 68%,transparent 70%);animation:spin 3s linear infinite}
.pf-speed{left:24%;top:24%;width:52%;height:52%;border:3px dashed var(--rc);animation:spin 1.2s linear infinite}
.pf-fortune{left:22%;top:22%;width:56%;height:56%;background:radial-gradient(circle at 12% 30%,var(--rc) 0 3px,#0000 4px),radial-gradient(circle at 88% 28%,var(--rc) 0 3px,#0000 4px),radial-gradient(circle at 50% 98%,var(--rc) 0 3px,#0000 4px),radial-gradient(circle at 50% 2%,var(--rc) 0 3px,#0000 4px);animation:spin 5s linear infinite,pfp 1s ease-in-out infinite alternate}
.pf-legacy{left:26%;top:26%;width:48%;height:48%;box-shadow:0 0 0 7px #0000,0 0 0 9px var(--rc),0 0 26px 10px var(--rc);animation:pfp 2.2s ease-in-out infinite alternate}
.bsv.myth{animation:hue 4s linear infinite}.bsv.leg{animation:shim 2s ease-in-out infinite}@keyframes shim{50%{filter:brightness(1.35)}}
.pc{display:flex;align-items:center;gap:10px;background:var(--p1);border-radius:10px;padding:8px;margin-bottom:8px;border-left:5px solid var(--rc)}
.pc.act{box-shadow:0 0 14px -2px var(--rc)}.pc .bt{flex:none;filter:drop-shadow(0 0 8px var(--rc))}
.pi{flex:1;min-width:0;line-height:1.15}.pi>b{font-size:15px}.rb{font-style:normal;font-size:11px;background:var(--rc);color:#111;border-radius:8px;padding:0 8px;font-weight:700;margin-left:6px}
.pi span{display:block;font-size:12px;color:var(--mut)}.pn{font-weight:700;color:var(--y)}
.pcat{background:var(--p1);border-radius:10px;padding:8px;margin-bottom:8px}.pcat>b{font-size:15px;display:block}
.crow{display:flex;align-items:center;gap:8px;border-left:4px solid var(--rc);padding:2px 6px;margin-top:4px;background:#0003;border-radius:4px}
.crow .cr{flex:1;line-height:1.1}.crow b{font-size:13px;color:var(--rc)}.crow span{display:block;font-size:11px;color:var(--mut)}.crow em{font-style:normal;font-weight:700;color:var(--y)}
.pquaff{position:fixed;left:50%;top:45%;z-index:90;pointer-events:none;animation:quaff 1.4s ease forwards;filter:drop-shadow(0 0 20px var(--rc))}
@keyframes quaff{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}50%{transform:translate(-50%,-50%) scale(1.15) rotate(-70deg)}100%{opacity:0;transform:translate(-50%,-90%) scale(.8) rotate(-70deg)}}
.pbub{position:absolute;left:50%;top:40%;width:9px;height:9px;border-radius:50%;opacity:0;animation:pbub 1s .35s ease-out forwards}
@keyframes pbub{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#wrap.pflash{animation:pflash .9s}@keyframes pflash{0%,100%{filter:none}40%{filter:brightness(1.5) drop-shadow(0 0 28px var(--rc))}}
@media(prefers-reduced-motion:reduce){.pfxl,.bsv,.pquaff,.pbub,#wrap.pflash{animation:none!important}}

button,.btn,#name,#count,#ttl,.sptitle,h3,.qn,.qdiff,.rb,.hd,.wlh,.wt b,.item .t b,.pi>b,.chi b,.chn,.pn,#tip b,.wnote,.wgo,.wp,.wpill,.qhead b,.chip,.pch,.skin b,.splab b,.brow b,.pcat>b,.crow b,#ascinfo,.qfly,.qtabs button{font-family:'Lilita One','Fredoka','Baloo 2','Comic Sans MS','Chalkboard SE',cursive!important;font-weight:400!important;letter-spacing:.3px}
button,.btn{text-shadow:0 1px 0 #0003}
#count{text-shadow:0 3px 0 #000a;-webkit-text-stroke:1.2px #0006}
.sptitle,.wlh{-webkit-text-stroke:2px #0006;paint-order:stroke fill;transform:rotate(-1.5deg);transform-origin:left center}
.qn,.item .t b,.wt b{text-shadow:0 2px 0 #0005}
#app{grid-template-columns:minmax(0,32%) minmax(0,1fr) minmax(0,22%)}
#mode{flex-wrap:wrap}
@media(min-width:761px){.item{padding:5px 6px;gap:6px}.item .t b{font-size:15px}.item .t span{font-size:12px}.item .o{font-size:20px}.u{width:36px;height:36px}.hd{font-size:15px}}
@media(max-width:760px){#app{grid-template-columns:minmax(0,32%) minmax(0,1fr) minmax(0,26%)}}

/* ---- PIEDRA (donde en Cookie Clicker hay madera): marco central, cabecera, botones, separadores ---- */
#mid{background:var(--stone) #6b7079;background-size:192px;border-inline:3px solid #15171b;padding:0 12px 12px;box-shadow:inset 3px 0 0 #ffffff30,inset -3px 0 0 #0006}
#head{background:transparent;padding:8px 0;height:auto;gap:8px;align-items:stretch}
.stk button,#spbtn,#skbtn,#msbtn,#chbtn,#pobtn,#name{background:var(--stone) #6b7079;background-size:192px;border:2px solid #15171b;border-radius:6px;color:#fff;text-shadow:0 2px 0 #000c;box-shadow:inset 0 2px 0 #ffffff55,inset 0 -3px 0 #0007}
.stk button.on,#spbtn.on,#skbtn.on,#msbtn.on,#chbtn.on,#pobtn.on{background:linear-gradient(#ffe45c,#e6b800);color:#241c00;text-shadow:none}
#name{padding:0 14px}.stk button{min-height:30px}#spbtn,#skbtn,#msbtn,#chbtn,#pobtn{min-height:30px}
#news{background:#0c0f16d9;border:2px solid #15171b;box-shadow:inset 0 2px 0 #0008;color:#e8ecf7}
.brow{margin:0 0 8px;border:2px solid #15171b;box-shadow:inset 0 2px 0 #ffffff25,0 3px 0 #0006}
.brow:first-child{margin-top:8px}
.u{background:var(--stone) #6b7079;background-size:96px;border:3px solid #15171b;box-shadow:inset 0 2px 0 #ffffff55,inset 0 -3px 0 #0007}
/* ---- MADERA en la tienda (donde en Cookie Clicker hay piedra) ---- */
#app{grid-template-columns:minmax(0,28%) minmax(0,1fr) minmax(0,34%)}
.hd{background:#0a0d16;text-align:center;font-size:clamp(16px,2vw,26px);padding:2px 10px;text-shadow:0 2px 0 #000}
#mode{flex-wrap:wrap}#mode button{font-size:clamp(12px,1.4vw,18px);padding:3px 4px}
.item{background:var(--wood) #6a4426;background-size:192px;color:#fff;border:0;border-bottom:3px solid #20130a;box-shadow:inset 0 3px 0 #ffffff33,inset 0 -4px 0 #0006;text-shadow:0 2px 0 #000b;min-height:clamp(56px,6.8vw,92px);padding:8px 12px;gap:12px}
.item:disabled{filter:brightness(.55)}
.item .e{flex:none;display:flex;align-items:center;justify-content:center;width:clamp(36px,4.8vw,64px);height:clamp(36px,4.8vw,64px)}
.item .e .ci{width:clamp(34px,4.6vw,60px);height:auto}
.item .e .fi{width:clamp(34px,4.6vw,60px);height:clamp(34px,4.6vw,60px)}
.item .t b{font-size:clamp(15px,2vw,27px);line-height:1}
.item .t span{font-size:clamp(12px,1.5vw,20px);color:#9dffb8}
.item:disabled .t span{color:#ffb0b0}
.item .o{font-size:clamp(22px,3vw,42px);opacity:.55}
@media(max-width:760px){#app{grid-template-columns:minmax(0,30%) minmax(0,1fr) minmax(0,36%)}}

/* piedra distinta en cada borde, sin líneas negras */
#mid{background:var(--st5);background-size:192px;border-inline:0;box-shadow:none;padding:0 14px 14px}
#mid::before,#mid::after{content:'';position:absolute;top:0;bottom:0;width:14px;z-index:5;pointer-events:none;background-size:192px}
#mid::before{left:0;background-image:var(--st2)}#mid::after{right:0;background-image:var(--st3)}
#head{background:var(--st1);background-size:192px;padding:8px;gap:8px;border-bottom:0}
#news{border:2px solid #ffffff22;box-shadow:none}
.scn{display:flex;flex-direction:column;min-height:100%}
.sep{flex:none;height:16px;background-size:192px}.sep.s1{background-image:var(--st6)}.sep.s2{background-image:var(--st7)}.sep.s3{background-image:var(--st8)}
.brow{flex:1 1 130px;margin:0;border:0;box-shadow:inset 0 2px 0 #ffffff22;padding:8px 12px;min-height:120px}
.brow:first-child{margin-top:0}
.brow b{font-size:clamp(16px,2vw,24px);left:12px;top:6px}
.brow .ic{max-height:none;margin-top:34px;line-height:1}
.brow .ic .fi{width:clamp(26px,3vw,40px);height:clamp(26px,3vw,40px)}
/* botones negros */
.stk button,#spbtn,#skbtn,#msbtn,#chbtn,#pobtn{background:#000;border:2px solid #2d2d33;box-shadow:none;color:#fff;text-shadow:none}
.stk button.on,#spbtn.on,#skbtn.on,#msbtn.on,#chbtn.on,#pobtn.on{background:linear-gradient(#ffe45c,#e6b800);color:#241c00}
#name{background:#000a;border:2px solid #ffffff30;box-shadow:none;text-shadow:none}
/* derecha: barras de piedra y mejoras grandes con marco de madera */
.sbar{flex:none;height:16px;background-size:192px}.sb1{background-image:var(--st4)}.sb2{background-image:var(--st6)}
#upg{gap:10px;padding:12px 8px;min-height:0;justify-content:center;background:#0a0d16}
.u{width:clamp(52px,5.8vw,76px);height:clamp(52px,5.8vw,76px);padding:clamp(5px,.7vw,9px);background:var(--wood) #6a4426;background-size:192px;border:0;border-radius:6px;box-shadow:inset 0 3px 0 #ffffff40,inset 0 -3px 0 #0006,0 3px 0 #20130a}
.u img{width:100%;height:100%;object-fit:contain;background:#150e07;border-radius:4px;padding:3px;box-shadow:inset 0 2px 4px #000c}
.scn .brow{flex:1 1 84px;min-height:84px}
.item .t b{line-height:1.05;font-size:15px}

/* ---- recompensas: grupo y avisos amarillos ---- */
#rwbtn{min-height:30px;padding:0 8px;border-radius:4px;border:2px solid #2d2d33;background:#000;color:#fff;font-size:14px;cursor:pointer}
#rwbtn.open{box-shadow:0 0 0 2px #ffe45c}
#rwmenu{display:none;flex-basis:100%;gap:6px;justify-content:center;flex-wrap:wrap}#rwmenu.open{display:flex}
#msbtn.pend,#chbtn.pend,#pobtn.pend,#rwbtn.pend{background:linear-gradient(#ffe45c,#e6b800)!important;color:#241c00!important;animation:pendp 1.4s ease-in-out infinite}
@keyframes pendp{50%{box-shadow:0 0 12px 3px #ffe45c}}
#msbtn.alert{animation:none;box-shadow:none}
@media(prefers-reduced-motion:reduce){#msbtn.pend,#chbtn.pend,#pobtn.pend,#rwbtn.pend{animation:none!important}}
/* ---- capa oscura bajo los veritys ---- */
#cbox{align-self:stretch;margin:6px -8px;padding:8px 6px;background:rgba(0,0,0,.55);text-align:center}
#cbox #count{margin-top:0}
/* ---- sin tambaleo al activar pociones: se reserva el hueco de la barra ---- */
#pbar{flex:none;flex-wrap:nowrap;justify-content:flex-start;height:34px;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;align-items:center}#pbar::-webkit-scrollbar{display:none}.pch{flex:none}
#left{overflow-x:hidden;scrollbar-gutter:stable}
/* ---- números de clic más lentos, tipografía Cookie Clicker ---- */
.pop{font-family:'Merriweather',Georgia,'Times New Roman',serif!important;font-weight:700!important;font-size:22px;animation:up2 2.4s ease-out forwards;text-shadow:0 0 3px #000,0 2px 5px #000}
@keyframes up2{0%{opacity:0;transform:translateY(0) scale(.7)}8%{opacity:1;transform:translateY(-6px) scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-95px)}}
/* ---- iconos de la tienda un poco más grandes ---- */
.item .e{width:clamp(42px,5.6vw,76px);height:clamp(42px,5.6vw,76px)}
.item .e .ci{width:clamp(40px,5.3vw,70px)}
.item .e .fi{width:clamp(40px,5.3vw,70px);height:clamp(40px,5.3vw,70px)}
/* ---- piedra: cubre el título y baja hasta la madera ---- */
.sb1{height:34px}
#mode{background:var(--st6);background-size:192px;padding:16px 8px 14px;gap:5px;border:0}
/* ---- mejoras: 8 por fila pegadas a la izquierda, el resto con scroll ---- */
#upg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;padding:7px 6px;justify-content:start;align-content:start;min-height:0;flex:none;max-height:calc(5.6vw + 20px);overflow-y:auto;background:#0a0d16;scrollbar-width:thin}
.u{width:auto;height:auto;aspect-ratio:1;padding:clamp(3px,.45vw,6px)}
@media(max-width:760px){#upg{grid-template-columns:repeat(4,minmax(0,1fr));max-height:calc(12vw + 20px)}}
.sb1{display:flex;align-items:center;justify-content:center}
.sblabel{font-family:'Lilita One','Fredoka',cursive;font-size:clamp(16px,1.6vw,22px);color:#ffd91f;text-shadow:0 2px 0 #000,0 0 6px #000;letter-spacing:.5px}
.wcov{width:100%;height:100%;border-radius:50%;border:5px solid #e6b800;box-shadow:0 0 0 2px #7a5a00,inset 0 0 0 2px #fff6,0 3px 6px #0006;position:relative;box-sizing:border-box}

.item .qm{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font:400 clamp(30px,3.4vw,52px) 'Lilita One','Fredoka',cursive;color:#fff9;text-shadow:0 2px 0 #000}

 e.innerHTML='<h3>Colección</h3><div><b>Títulos:</b> '+ch(S.titles,'ti',S.title,TITLES)+'</div><div style="margin-top:4px"><b>Efectos:</b> '+ch(S.fx,'fx',S.fxOn,FXN)+'</div><div class="qd" style="margin-top:4px">Toca uno para equiparlo o quitarlo. Las skins exclusivas están en Skins.</div>';
 e.onclick=ev=>{const b=ev.target.closest('[data-ti],[data-fx]');if(!b)return;if(b.dataset.ti!==undefined)S.title=S.title===b.dataset.ti?'':b.dataset.ti;else S.fxOn=S.fxOn===b.dataset.fx?'':b.dataset.fx;applyCos();renderCol();save()}}
function renderQ(){const v=$('#view');
 v.innerHTML='<div class="qhead"><span>Fichas: <b id="qtok"></b></span><span>Avanzadas: <b id="qtok2"></b></span><span>Cofres: <b id="qch"></b></span><button class="btn" id="qopen">Ver cofres</button><span>Cristales: <b id="qcry"></b></span></div><div class="qtabs">'+[['d','Diarias'],['w','Semanales'],['g','Legendarias']].map(([k,n])=>`<button data-qt="${k}" class="${qt===k?'on':''}">${n}</button>`).join('')+'</div><div class="qtime" id="qtime"></div><div id="qlist"></div><div id="qcol"></div>';
 $('#qlist').innerHTML=qlist(qt).map((_,i)=>{const q=qv(qt,i);return `<div class="qc" data-i="${i}" data-dn="${q.st.done?1:0}" style="--dc:${q.col}"><span class="qdiff">${q.dname}</span><div class="qn">${q.n}</div><div class="qd">${q.d}</div><div class="qbar"><i></i></div><div class="qrow"><span class="qp"></span></div><div class="qr"></div><button class="btn qclaim">Reclamar</button></div>`}).join('');
 v.querySelectorAll('[data-qt]').forEach(b=>b.onclick=()=>{qt=b.dataset.qt;renderQ()});
 v.querySelectorAll('.qc').forEach(el=>el.querySelector('.qclaim').onclick=()=>claimQ(qt,+el.dataset.i,el));

setInterval(()=>{if(cps()>0)drop()},700);setInterval(()=>{if(Math.random()<.001*PM.fs()*PM.sp())spawnPass()},1000);setInterval(save,10000);let _usig='';setInterval(()=>{if(S.n>(S.hi||0))S.hi=S.n;const g=U.map((u,i)=>!S.u.includes(i)&&(!u[6]||u[6]())?i:-1).filter(x=>x>=0).join()+'|'+B.map((_,i)=>bst(i)).join('');if(g!==_usig){_usig=g;store();if(!tab)scene()}},500);setInterval(()=>say(NEWS[++ni%NEWS.length]),10000);

function closeAsc(){const m=document.getElementById('ascmodal');if(m)m.remove()}
function openAsc(){try{_openAsc()}catch(e){say('Error al abrir el menú de ascender: '+e.message)}}
function _openAsc(){if(S.asc){say('Ya estás en la ascensión: gasta tus puntos y reencarna');return}
 const p=Math.floor(Math.floor(Math.cbrt((S.t||0)/1e6))*((PM&&PM.lp)?PM.lp():1));closeAsc();const m=document.createElement('div');m.id='ascmodal';const mult=(1+(S.leg+p)*.01).toFixed(2);
 m.innerHTML=p<1?`<div class="ambox"><h3>Ascender</h3><p>Todavía no puedes ascender. Necesitas haber conseguido <b>1 M de veritys</b> en total (llevas ${f(S.t)}).</p><div class="amrow"><button class="btn" id="amno">Cerrar</button></div></div>`:`<div class="ambox"><h3>Ascender</h3><p>Ganarás <b>+${p}</b> puntos de legado (producción total <b>x${mult}</b>).</p><p>Perderás tus veritys, edificios y mejoras. Conservas skins, misiones, cofres, pociones y fichas.</p><div class="amrow"><button class="btn red" id="amyes">Ascender</button><button class="btn" id="amno">Cancelar</button></div></div>`;
 document.body.appendChild(m);m.addEventListener('pointerdown',e=>{if(e.target===m)closeAsc()});document.getElementById('amno').onclick=closeAsc;const y=document.getElementById('amyes');if(y)y.onclick=()=>{closeAsc();doAscend(p)}}
{const a=$('#ascinfo');a.title='Abrir el menú de ascensión';a.setAttribute('role','button')}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#ascinfo'))openAsc()});
function parseBig(t){const m=String(t).trim().toLowerCase().replace(/,/g,'.').match(/^([0-9]*\.?[0-9]+(?:e[+-]?[0-9]+)?)\s*([a-z]{0,2})$/);if(!m)return NaN;const SUF={'':0,k:3,m:6,b:9,t:12,qa:15,qi:18,sx:21,sp:24,oc:27,no:30,dc:33};if(!(m[2] in SUF))return NaN;return parseFloat(m[1])*Math.pow(10,SUF[m[2]])}
function closeCheat(){const m=document.getElementById('cheatmodal');if(m)m.remove()}
function openCheat(){closeCheat();const m=document.createElement('div');m.id='cheatmodal';
 m.innerHTML=`<div class="ambox"><h3>Modo secreto</h3><p>¿Cuántos veritys quieres tener?</p><input id="chIn" type="text" value="1e12" autocomplete="off" spellcheck="false"><div class="chq">${[['1 M','1e6'],['1 B','1e9'],['1 T','1e12'],['1 Qa','1e15'],['1 Sx','1e21'],['1 Sp','1e24'],['1 Dc','1e33']].map(q=>`<button class="btn" data-v="${q[1]}">${q[0]}</button>`).join('')}</div><p style="font-size:13px;color:#9fb0d8">Acepta 1e12, 5T, 2.5B…</p><div class="amrow"><button class="btn red" id="chOk">Aplicar</button><button class="btn" id="chNo">Cerrar</button></div></div>`;
 document.body.appendChild(m);const inp=document.getElementById('chIn');setTimeout(()=>{inp.focus();inp.select()},50);
 m.querySelectorAll('.chq button').forEach(b=>b.onclick=()=>{inp.value=b.dataset.v;inp.focus()});
 const ok=()=>{const v=parseBig(inp.value);if(!isFinite(v)||v<0){inp.style.borderColor='#ff4d4d';return}S.n=v;S.t=Math.max(S.t,v);S.hi=Math.max(S.hi||0,v);S.cheat=1;closeCheat();store();upd();save();say('Modo secreto: ahora tienes '+f(v)+' veritys')};
 document.getElementById('chOk').onclick=ok;document.getElementById('chNo').onclick=closeCheat;inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')ok();if(e.key==='Escape')closeCheat()});m.addEventListener('pointerdown',e=>{if(e.target===m)closeCheat()})}
{const nm=$('#name'),isCode=t=>t.replace(/\s+/g,'').toLowerCase()==='sixsevenpapoi';let was=false;
 const check=()=>{const ok=isCode(nm.textContent);if(ok&&!was&&!document.getElementById('cheatmodal'))openCheat();was=ok};
 nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nm.blur()}});
 nm.addEventListener('input',check);nm.addEventListener('blur',check);nm.addEventListener('keyup',check);
 $('#count').addEventListener('dblclick',()=>{if(isCode(nm.textContent))openCheat()})}
setInterval(()=>{if(tab!=='leg')return;const e=document.getElementById('legst');if(!e)return;const p=Math.floor(Math.floor(Math.cbrt((S.t||0)/1e6))*((PM&&PM.lp)?PM.lp():1));e.innerHTML='Puntos ahora: <b>'+S.leg+'</b><br>Ganarías: <b>'+p+'</b> (necesitas 1 M de veritys totales)';const b=document.getElementById('as');if(b)b.style.opacity=p<1?'.6':''},500);
function autoSkin(){if(!S.skSeen){S.skSeen=[...S.sk];return}
 S.sk.forEach(id=>{if(S.skSeen.includes(id))return;S.skSeen.push(id);const m=SKM[id];if(m&&m>(SKM[S.cur]||1)){const k=[...FACES,SECRET,...XSK].find(x=>x[0]===id);S.cur=id;drawBall();say('Nueva skin equipada: '+(k?k[1]:id)+' (x'+m+')');save();if(tab==='skins')view()}})}
setInterval(autoSkin,600);
function applyStart(){S.n=hsum('sn');S.t=0;S.k=0;S.b=B.map(_=>0);S.u=[];S.b[0]=hmax('sc');S.lap=Math.min(5,Math.floor(S.b[0]/PER));S.tok=(S.tok||0)+hsum('tk');S.tok2=(S.tok2||0)+hsum('tk2');const c=hsum('ch');if(c){S.chs=S.chs||{};S.chs.c=(S.chs.c||0)+c}}
function setAscUI(on){document.body.classList.toggle('asc',!!on);const l=document.querySelector('.sblabel');if(l)l.textContent=on?'Mejoras celestiales':'Mejoras'}
function renderHeaven(){const st=$('#store');
 st.innerHTML=`<div class="hhead"><div><b>Puntos de legado disponibles</b><span class="hpts">${hav()}</span></div><button class="btn red" id="hre">Reencarnar</button></div><div class="hnote">Gasta tus puntos y pulsa Reencarnar para empezar una nueva partida.</div>`+HU.map(h=>{const own=hu().includes(h.id),okreq=h.req==null||hu().includes(h.req);
  if(!okreq&&!own)return `<button class="item hv lockh" data-hv="${h.id}" disabled><span class="e"><span class="qm">?</span></span><span class="t"><b>???</b><span>Requiere: ${HU[h.req].n}</span></span></button>`;
  return `<button class="item hv${own?' own':''}" data-hv="${h.id}"${(!own&&hav()<h.c)?' disabled':''}><span class="e"><img class="fi" alt="" src="${icGem(h.col)}"></span><span class="t"><b>${h.n}</b><span>${h.d}</span></span><span class="o hc">${own?'✔':h.c+' pts'}</span></button>`}).join('');
 $('#hre').onclick=exitAsc;
 st.querySelectorAll('.hv:not(.lockh)').forEach(b=>b.onclick=()=>{const h=HU[+b.dataset.hv];if(hu().includes(h.id)||hav()<h.c)return;hu().push(h.id);S.legSp=(S.legSp||0)+h.c;say('Mejora celestial: '+h.n);renderHeaven();if(tab==='asc')renderAscPanel();save()})}
function renderAscPanel(){const v=$('#view');v.innerHTML=`<h3 style="margin-top:0">Ascensión</h3><p>Has ascendido. Tus <b>${S.leg}</b> puntos de legado dan <b>+${S.leg}%</b> de producción para siempre.</p><p>Puntos por gastar: <b>${hav()}</b></p><p>Elige mejoras celestiales en la columna de la derecha. Cuando termines, pulsa <b>Reencarnar</b> para empezar una nueva partida con ellas.</p><button class="btn red" id="hre2">Reencarnar</button>`;$('#hre2').onclick=exitAsc}
function enterAsc(){S.asc=1;setAscUI(true);tab='asc';store();view();upd()}
function exitAsc(){S.asc=0;setAscUI(false);applyStart();tab=null;ring();store();view();upd();say('¡Nueva partida! Tus mejoras celestiales están activas');save()}
function doAscend(p){S.leg+=p;S.st.asc++;S.n=0;S.t=0;S.k=0;S.b=B.map(_=>0);S.u=[];S.lap=0;ring();enterAsc();say('Ascensión: gasta tus puntos de legado (+'+p+')');save()}
if(S.asc){setAscUI(true);tab='asc';store();view()}
